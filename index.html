<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busy License Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #38bdf8; --border: #334155; }
        body { font-family: 'Segoe UI', sans-serif; background: var --bg; color: var --text; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .summary-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-box { background: var(--card); padding: 15px; border-radius: 10px; border: 1px solid var(--border); text-align: center; }
        .stat-val { font-size: 1.5rem; font-weight: bold; color: var(--accent); display: block; }
        .stat-label { font-size: 0.8rem; opacity: 0.7; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); cursor: pointer; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .chart-container { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; height: 400px; }
        #detailPage { display: none; }
        .back-btn { background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: var(--card); }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: rgba(56, 189, 248, 0.1); color: var(--accent); }
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <p id="loadMsg">Decompressing and Loading Data...</p>
</div>

<!-- Landing Page -->
<div id="landingPage">
    <div class="header">
        <h1>Busy License Analytics</h1>
        <div id="lastUpdated" style="font-size: 0.9rem; opacity: 0.6;"></div>
    </div>

    <div class="summary-bar" id="topSummary"></div>
    <div class="grid" id="categoryCards"></div>
    
    <div class="grid" style="grid-template-columns: 1fr 1fr;">
        <div class="chart-container"><canvas id="customerClusterChart"></canvas></div>
        <div class="chart-container"><canvas id="partnerClusterChart"></canvas></div>
    </div>
</div>

<!-- Detail Page -->
<div id="detailPage">
    <button class="back-btn" onclick="showLanding()">← Back to Dashboard</button>
    <h2 id="detailTitle">Category Detail</h2>
    <div class="summary-bar" id="detailKpis"></div>
    
    <div class="grid">
        <div class="chart-container"><canvas id="licenseTypeChart"></canvas></div>
        <div class="chart-container"><canvas id="modelChart"></canvas></div>
    </div>

    <h3>RDP User Distribution</h3>
    <table id="rdpTable">
        <thead>
            <tr><th>RDP Users</th><th>Unique Subscriptions</th><th>Avg CompGUIDs</th><th>Avg GSTINs</th></tr>
        </thead>
        <tbody id="rdpTableBody"></tbody>
    </table>
</div>

<script>
let rawData = [];
let charts = {};

// Register DataLabels plugin
Chart.register(ChartDataLabels);

async function autoLoadData() {
    const statusMsg = document.getElementById('loadMsg');
    try {
        // Fetch the GZIPPED file
        const response = await fetch('data.csv.gz');
        if (!response.ok) throw new Error('Network response was not ok');

        // Decompress GZIP stream in browser
        const ds = new DecompressionStream('gzip');
        const decompressedStream = response.body.pipeThrough(ds);
        
        // Convert stream to text
        const reader = decompressedStream.getReader();
        let csvText = '';
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            csvText += new TextDecoder().decode(value);
        }

        statusMsg.innerText = "Parsing Data...";
        parseCSV(csvText);
        document.getElementById('loader').style.display = 'none';
        renderLanding();
    } catch (err) {
        console.error(err);
        statusMsg.innerHTML = `<span style="color:red">Error: Data file not found.</span><br>Ensure data.csv.gz is in the same folder on GitHub.`;
    }
}

function parseCSV(text) {
    const lines = text.split('\n');
    const headers = lines[0].split(',').map(h => h.trim());
    
    for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const cols = lines[i].split(',');
        let obj = {};
        headers.forEach((h, idx) => {
            obj[h] = cols[idx] ? cols[idx].trim() : '';
        });
        
        // Pre-process numbers
        obj['RDP Count'] = parseInt(obj['RDP Count']) || 0;
        rawData.push(obj);
    }
}

function formatNum(num) {
    if (num >= 100000) return (num/100000).toFixed(1) + 'L';
    if (num >= 1000) return (num/1000).toFixed(1) + 'K';
    return num;
}

function renderLanding() {
    const categories = ['CA', 'Accountant', 'GSTP', 'Regular'];
    const container = document.getElementById('categoryCards');
    container.innerHTML = '';

    categories.forEach(cat => {
        const catData = rawData.filter(d => d.licenseCategory === cat);
        const uniqueSub = new Set(catData.map(d => d.subscriptionId)).size;
        
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => showDetail(cat);
        card.innerHTML = `
            <h3>${cat}</h3>
            <div class="stat-val">${formatNum(uniqueSub)}</div>
            <div class="stat-label">Unique Subscriptions</div>
        `;
        container.appendChild(card);
    });

    renderClusterChart('customerClusterChart', 'Customer Cluster');
    renderClusterChart('partnerClusterChart', 'Partner Cluster');
}

function renderClusterChart(canvasId, field) {
    const clusters = [...new Set(rawData.map(d => d[field]))].filter(Boolean);
    const data = clusters.map(c => {
        const clusterRows = rawData.filter(d => d[field] === c);
        const total = new Set(clusterRows.map(d => d.subscriptionId)).size;
        const rdpSubs = new Set(clusterRows.filter(d => d['RDP Count'] > 0).map(d => d.subscriptionId)).size;
        return { 
            cluster: c, 
            total, 
            rdpPerc: total > 0 ? (rdpSubs / total * 100).toFixed(1) : 0 
        };
    }).sort((a, b) => b.total - a.total).slice(0, 10);

    new Chart(document.getElementById(canvasId), {
        type: 'bar',
        data: {
            labels: data.map(d => d.cluster),
            datasets: [
                {
                    label: 'Subscriptions',
                    data: data.map(d => d.total),
                    backgroundColor: '#38bdf8',
                    yAxisID: 'y',
                    datalabels: { align: 'top', anchor: 'end', formatter: v => formatNum(v) }
                },
                {
                    label: 'RDP Adoption %',
                    data: data.map(d => d.rdpPerc),
                    type: 'line',
                    borderColor: '#fbbf24',
                    yAxisID: 'y1',
                    datalabels: { align: 'bottom', anchor: 'start', formatter: v => v + '%' }
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { 
                legend: { position: 'bottom' },
                datalabels: { color: '#fff', font: { size: 10 } }
            },
            scales: {
                y: { type: 'linear', position: 'left', grid: { color: '#334155' } },
                y1: { type: 'linear', position: 'right', grid: { display: false } }
            }
        }
    });
}

function showDetail(category) {
    document.getElementById('landingPage').style.display = 'none';
    document.getElementById('detailPage').style.display = 'block';
    document.getElementById('detailTitle').innerText = category + " Analytics";
    
    const catData = rawData.filter(d => d.licenseCategory === category);
    
    // RDP Table
    const rdpBuckets = ['No RDP', '1-5', '6-10', '11-25', '25+'];
    const tbody = document.getElementById('rdpTableBody');
    tbody.innerHTML = '';
    
    rdpBuckets.forEach(b => {
        let filtered = [];
        if (b === 'No RDP') filtered = catData.filter(d => d['RDP Count'] === 0);
        else if (b === '1-5') filtered = catData.filter(d => d['RDP Count'] >= 1 && d['RDP Count'] <= 5);
        else if (b === '6-10') filtered = catData.filter(d => d['RDP Count'] >= 6 && d['RDP Count'] <= 10);
        else if (b === '11-25') filtered = catData.filter(d => d['RDP Count'] >= 11 && d['RDP Count'] <= 25);
        else filtered = catData.filter(d => d['RDP Count'] > 25);
        
        const subCount = new Set(filtered.map(d => d.subscriptionId)).size;
        if (subCount > 0) {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${b}</td><td>${subCount}</td><td>-</td><td>-</td>`;
            tbody.appendChild(tr);
        }
    });
}

function showLanding() {
    location.reload(); // Simplest way to reset charts
}

autoLoadData();
</script>
</body>
</html>
